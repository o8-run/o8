[package]
name = "o8-update-ping-native-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
tauri = { version = "=2.11.1", default-features = false, features = ["test"] }
tauri-plugin-updater = "=2.10.0"
tauri-plugin-store = "=2.4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1.54.1", features = ["time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "blocking"] }
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }

chrono = "0.4"
log = "0.4"
tauri-plugin-notification = "2"
o8-restart-safety = { path = "../../../crates/o8-restart-safety" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
