[package]
name = "o8-next"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
default-run = "o8-next"
build = "src/shell_feature_build.rs"

[features]
macos-diagnostics = ["gpui/frame-diagnostics"]

[[bin]]
name = "o8-next-macos-check"
path = "diagnostics/macos_repaint.rs"
required-features = ["macos-diagnostics"]

[dependencies]
async-channel = "=2.5.0"
alacritty_terminal = { version = "=0.26.0", default-features = false }
base64 = "=0.22.1"
getrandom = "=0.3.4"
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
regex = "=1.13.1"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
ureq = { version = "=2.12.1", default-features = false, features = ["json"] }
url = "=2.5.8"
unicode-segmentation = "=1.13.2"
tree-sitter = "=0.25.10"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.0"
tree-sitter-json = "=0.24.8"
tree-sitter-md = "=0.5.3"

# Shell work: the release app needs the real Linux renderer, not the test platform.
[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "x11"] }

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "=0.2.7"
block = "=0.1.6"
raw-window-handle = "=0.6.2"

[workspace]

# Keep interactive debug painting and terminal parsing responsive while retaining
# the debug assertions and overflow checks used by the native regression suite.
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2

[[example]]
name = "window-occlusion"
path = "test-support/window_occlusion.rs"

# Published GPUI pins Taffy exactly; backport its internal Grid security update.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
taffy = { path = "vendor/taffy" }

[[bin]]
name = "o8-next-visualization-check"
path = "diagnostics/visualization_check.rs"
test = false
