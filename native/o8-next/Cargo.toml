[package]
name = "o8-next"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
async-channel = "=2.5.0"
alacritty_terminal = { version = "=0.26.0", default-features = false }
base64 = "=0.22.1"
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
regex = "=1.13.1"
serde = { version = "=1.0.228", features = ["derive", "rc"] }
serde_json = { version = "=1.0.150", features = ["preserve_order"] }
ureq = { version = "=2.12.1", default-features = false, features = ["json"] }
url = "=2.5.8"
unicode-segmentation = "=1.13.2"
tree-sitter = "=0.25.10"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.0"
tree-sitter-json = "=0.24.8"
tree-sitter-md = "=0.5.3"

[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "=0.2.7"
raw-window-handle = "=0.6.2"

[workspace]

# Published GPUI pins Taffy exactly; backport its internal Grid security update.
[patch.crates-io]
taffy = { path = "vendor/taffy" }
