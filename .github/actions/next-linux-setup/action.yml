name: o8 next Linux setup
description: Shared native headless build prerequisites
inputs:
  cache-key:
    description: Separate release and test build outputs.
    default: ''
  browser:
    description: Install the parity browser
    default: 'false'
  headless-tests:
    description: Install compile prerequisites without graphical capture tools or driver upgrades.
    default: 'false'
outputs:
  native-cache-key:
    description: Compiler, native lockfile and source key shared by all test shards.
    value: ${{ steps.native-cache-key.outputs.key }}
  native-cache-hit:
    description: Whether all native build inputs matched the restored cache.
    value: ${{ steps.native-cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - shell: bash
      run: npm install -g "$(node -p 'require("./package.json").packageManager')"
    - shell: bash
      run: npm ci --prefer-offline
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: stable
    - if: inputs.headless-tests != 'true'
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        workspaces: native/o8-next
        key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - id: native-cache-key
      if: inputs.headless-tests == 'true'
      shell: bash
      run: node scripts/ci/native-test-cache.mjs key
    - id: native-cache
      if: inputs.headless-tests == 'true'
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          native/o8-next/target
          .o8-next-cargo/registry
          .o8-next-cargo/git
        key: ${{ steps.native-cache-key.outputs.key }}
        restore-keys: ${{ steps.native-cache-key.outputs.restore-key }}
    - if: inputs.headless-tests == 'true'
      shell: bash
      env:
        O8_NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
      run: node scripts/ci/native-test-cache.mjs restore
    - name: Install X11, fonts and software Vulkan
      shell: bash
      env:
        O8_NATIVE_HEADLESS_TESTS: ${{ inputs.headless-tests }}
      run: bash scripts/ci/install-native-linux-deps.sh
    - name: Install parity browser
      if: inputs.browser == 'true'
      shell: bash
      run: npx --no-install playwright-core install --with-deps chromium
