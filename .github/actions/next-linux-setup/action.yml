name: o8 next Linux setup
description: Install cached native build and fixture prerequisites.
inputs:
  cache-key:
    description: Separate release and test build outputs.
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      shell: bash
    - run: npm ci --prefer-offline
      shell: bash
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: stable
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        workspaces: native/o8-next
        key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Install X11, fonts and software Vulkan
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libvulkan-dev mesa-vulkan-drivers xvfb xauth x11-xserver-utils imagemagick fonts-dejavu-core
