name: Root npm dependencies
description: Exact platform and toolchain dependency restore with native load verification
runs:
  using: composite
  steps:
    - name: Identify installed Node and npm
      id: versions
      shell: bash
      run: |
        echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
        echo "npm=$(npm --version)" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
    # actions/cache saves only after the job succeeds. Main seeds the default
    # branch cache; PR writes stay in their merge-ref scope and cannot seed main.
    - name: Restore root node_modules
      id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: root-npm-ci-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.image }}-${{ steps.versions.outputs.node }}-${{ steps.versions.outputs.npm }}-${{ hashFiles('package-lock.json', 'package.json', '.npmrc', 'scripts/postinstall.mjs', 'patches/**', '.github/actions/node-modules-cache/action.yml') }}
    - name: Install root dependencies on exact miss
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --prefer-offline
    - name: Verify native modules after install or restore
      shell: bash
      run: node scripts/ci/check-native-modules.cjs
