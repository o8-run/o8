name: Current app startup discovery diagnostic

on:
  push:
    branches: [perf/current-app-launch-stages]
    paths: [.github/workflows/current-app-launch-ablation.yml]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          ref: 01ab614f9de8a3b597edb23137df1991859e9871
          path: harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm install -g npm@11.21.1
      - run: npm ci --prefer-offline
        working-directory: harness
      - uses: actions/download-artifact@v4
        with:
          name: current-app-launch-head-app
          run-id: 40395085469
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/saved
      - name: Restore the unchanged diagnostic app
        run: |
          mkdir -p saved-app
          tar -C saved-app -xf "$RUNNER_TEMP/saved/head-app.tar"
      - name: Three unchanged-app timing samples
        run: node lab/scripts/bench/native-launch-stages.mjs --harness=harness --app=saved-app/o8.app --sha=b47688c6becfc1adc9f9480daa455f5fce7812f2 --samples=3 --output="$RUNNER_TEMP/diagnostic-normal"
      - name: Suppress only tool discovery in the diagnostic observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lab/scripts/bench/launch-stage-preload.cjs')
          text = p.read_text()
          anchor = "    if (event === 'request') return context.run"
          assert text.count(anchor) == 1
          text = text.replace(anchor, """    if (event === 'request' && String(req.url).split('?')[0] === '/api/setup/cli-updates') {
                res.setHeader('Content-Type', 'application/json');
                res.end(JSON.stringify({ tools: [] }));
                return true;
              }
          """ + anchor)
          p.write_text(text)
          PY
      - name: Three diagnostic samples with the scan suppressed
        run: node lab/scripts/bench/native-launch-stages.mjs --harness=harness --app=saved-app/o8.app --sha=b47688c6becfc1adc9f9480daa455f5fce7812f2 --samples=3 --output="$RUNNER_TEMP/diagnostic-suppressed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-app-startup-discovery-diagnostic
          path: |
            ${{ runner.temp }}/diagnostic-normal/*.json
            ${{ runner.temp }}/diagnostic-suppressed/*.json
          retention-days: 1
