name: o8 next macOS build

# Every native check in ci.yml runs on Linux, so code behind
# cfg(target_os = "macos") in o8 next and its vendored toolkit was never
# compiled before merge (#5948). This type-checks the app and all of its tests
# on macOS, links a debug binary and starts it. Not a required check yet.

on:
  pull_request:
    branches: [main]
    paths: ['native/o8-next/**', '.github/workflows/next-macos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: macOS arm64 check and start
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            native/o8-next/target
          # Dependencies only change with the lockfile; the app crate rebuilds each run.
          key: next-macos-${{ runner.arch }}-${{ hashFiles('native/o8-next/Cargo.lock', 'native/o8-next/vendor/gpui/**') }}
      - name: Type-check the app and every test on macOS
        run: cargo check --locked --manifest-path native/o8-next/Cargo.toml --bin o8-next --tests --message-format short
      - name: Link the debug binary
        run: cargo build --locked --manifest-path native/o8-next/Cargo.toml --bin o8-next
      - name: Start the binary with --help
        run: |
          native/o8-next/target/debug/o8-next --help > "$RUNNER_TEMP/help.txt"
          head -40 "$RUNNER_TEMP/help.txt"
      - name: Record build output size
        if: always()
        run: |
          size="$(du -sh native/o8-next/target 2>/dev/null | cut -f1)"
          echo "native/o8-next/target: ${size:-none}" | tee -a "$GITHUB_STEP_SUMMARY"
