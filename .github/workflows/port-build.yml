name: Port Build

# Full end-to-end builds for the non-Darwin port (#1673, #1672):
# npm ci → Next build → tauri-export → cargo tauri build → installers as
# downloadable artifacts. The compile gates in ci.yml catch the rustc class
# cheaply on every PR; this workflow proves the REST of the pipeline (the
# Node build scripts, linking, bundling) and produces .msi/.deb/.AppImage
# artifacts to smoke-test on real machines. Manual + weekly — a full native
# build is too heavy for the PR lane.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing public release tag to receive Windows/Linux preview installers (for example v0.1.662)'
        required: false
        type: string
      replace_existing_assets:
        description: 'Replace existing Windows/Linux assets for the selected release tag'
        required: false
        default: false
        type: boolean
      sign_windows:
        description: 'Require Azure Artifact Signing for the Windows release build'
        required: false
        default: false
        type: boolean
      publish_target:
        description: 'Build and publish previews for both platforms or one platform only'
        required: false
        default: both
        type: choice
        options:
          - both
          - linux
          - windows
      publish_to_mirror:
        description: 'Also mirror the Linux AppImage + .sig to the updater mirror (hurttlocker/o8-releases) for this release_tag; requires the RELEASES_MIRROR_TOKEN secret and an already-signed .sig on the source release (see #2057)'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 10 * * 2'

permissions:
  contents: read

concurrency:
  group: port-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.publish_target == 'linux' && '["ubuntu-22.04"]' || github.event_name == 'workflow_dispatch' && inputs.publish_target == 'windows' && '["windows-latest"]' || '["windows-latest","ubuntu-22.04"]') }}
    # Linux builds on ubuntu-22.04, not ubuntu-latest: glibc is never bundled
    # (not even in the AppImage), so the runner's glibc is the oldest one the
    # package can start on. 24.04 runners produced a shell that needs
    # GLIBC_2.39, locking out Ubuntu 22.04, Debian 12, Mint 21 and Pop!_OS
    # 22.04. The glibc gate after the build keeps the floor at 2.35.
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual publish rebuilds the exact public tag. Blank manual and
          # scheduled runs retain the ordinary Actions-artifact behavior.
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10 — one npm version everywhere (see ci.yml).
      - run: npm install -g npm@11
      # The repo's npm scripts are authored for a POSIX sh (`sh -c '…'`).
      # GitHub's Windows runners ship Git Bash, so point npm at it instead
      # of cmd.exe. Making the scripts shell-neutral is tracked as a
      # contributor task on #1673.
      - if: runner.os == 'Windows'
        run: npm config set script-shell bash
      # Tauri v2 system deps for Linux bundling (webkit2gtk 4.1 line);
      # libfuse2 for appimagetool; libayatana-appindicator3-dev because o8 has
      # a tray icon and the tauri CLI PANICS pre-bundle without an appindicator
      # lib (run 31055946225 — the panic doesn't even fail the build step,
      # which is why the empty-upload guard below is load-bearing). No ALSA —
      # audio deps are macOS-only.
      - name: Install Linux bundle prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          echo "Unwind development packages before installation"
          dpkg-query -W -f='${Package} ${Version} ${Status}\n' 'libunwind*-dev' || true
          # The 22.04 image's libc++ headers pull in libunwind-14-dev, which
          # conflicts with GStreamer's libunwind-dev. Selecting the latter
          # explicitly lets APT replace the optional compiler headers while
          # retaining every required bundle dependency in this transaction.
          sudo apt-get install -y libunwind-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev build-essential libfuse2 libayatana-appindicator3-dev libvips-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-gl
          echo "Unwind and media development packages after installation"
          dpkg-query -W -f='${Package} ${Version} ${Status}\n' libunwind-dev libgstreamer1.0-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
      - run: npm ci --prefer-offline
      # Exercise the production launcher with the runner's native absolute paths
      # before starting the expensive build (Windows drive paths need file URLs).
      - run: npx vitest run tests/generated-output-launch.test.ts
      # Public release AppImages are signed with o8's durable Linux release
      # identity. Scheduled build artifacts remain unsigned diagnostics.
      - name: Configure Linux release signing
        if: runner.os == 'Linux' && inputs.release_tag != ''
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ vars.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$LINUX_GPG_PRIVATE_KEY" || -z "$LINUX_GPG_KEY_ID" ]]; then
            echo "Linux release signing credentials are not configured" >&2
            exit 1
          fi

          signing_home="$RUNNER_TEMP/o8-release-gpg"
          install -d -m 700 "$signing_home"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --homedir "$signing_home" --batch --import

          imported_fingerprint="$(
            gpg --homedir "$signing_home" --batch --with-colons \
              --list-secret-keys "$LINUX_GPG_KEY_ID" \
              | awk -F: '$1 == "fpr" { print $10; exit }'
          )"
          if [[ "$imported_fingerprint" != "$LINUX_GPG_KEY_ID" ]]; then
            echo "Imported Linux signing key does not match LINUX_GPG_KEY_ID" >&2
            exit 1
          fi

          {
            echo "GNUPGHOME=$signing_home"
            echo "SIGN=1"
            echo "LDAI_SIGN_KEY=$LINUX_GPG_KEY_ID"
            echo "APPIMAGETOOL_FORCE_SIGN=1"
          } >> "$GITHUB_ENV"
      - name: Configure Windows release signing
        if: runner.os == 'Windows' && inputs.release_tag != '' && inputs.sign_windows
        shell: pwsh
        env:
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $ErrorActionPreference = 'Stop'

          $required = @(
            'AZURE_ARTIFACT_SIGNING_ACCOUNT',
            'AZURE_ARTIFACT_SIGNING_ENDPOINT',
            'AZURE_ARTIFACT_SIGNING_PROFILE',
            'AZURE_CLIENT_ID',
            'AZURE_CLIENT_SECRET',
            'AZURE_TENANT_ID'
          )
          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Windows release signing value $name is not configured"
            }
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value"
          }

          cargo install artifact-signing-cli --version 0.11.0 --locked
      # The config overlay disables updater artifacts because the updater key
      # never leaves the macOS ship machine. Tagged Linux builds add GPG
      # signing; tagged Windows builds can add Authenticode through a second
      # overlay once the verified publisher identity is available.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # linuxdeploy's strip pass is a notorious CI failure ("failed to run
          # linuxdeploy" with stderr swallowed — run 31056828226, where deb and
          # rpm bundled fine and only AppImage died). Standard remedy.
          NO_STRIP: true
        with:
          # --verbose so the bundler passes through linuxdeploy's own stderr —
          # without it the AppImage failure is a bare "failed to run
          # linuxdeploy" (rounds 5-7, with NO_STRIP and the gstreamer set
          # already ruled out as cures).
          args: >-
            --verbose --config
            ${{ runner.os == 'Windows' && inputs.release_tag != '' && inputs.sign_windows && 'src-tauri/tauri.portci.windows-signed.conf.json' || 'src-tauri/tauri.portci.conf.json' }}
      - name: Verify Linux AppImage signature is embedded
        if: runner.os == 'Linux' && inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' appimages < <(
            find src-tauri/target/release/bundle -type f -name '*.AppImage' -print0
          )
          if [[ ${#appimages[@]} -ne 1 ]]; then
            echo "expected exactly one AppImage, found ${#appimages[@]}" >&2
            exit 1
          fi

          chmod +x "${appimages[0]}"
          signature="$("${appimages[0]}" --appimage-signature)"
          if [[ -z "$signature" ]]; then
            echo "AppImage does not contain an embedded signature" >&2
            exit 1
          fi
          echo "AppImage embedded signature is present"
      - name: Verify Linux glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' packages < <(
            find src-tauri/target/release/bundle -type f \( -name '*.deb' -o -name '*.AppImage' \) -print0
          )
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "no Linux deb or AppImage to check" >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            if [[ "$package" == *.AppImage ]]; then chmod +x "$package"; fi
          done
          node scripts/ci/check-linux-glibc.mjs --max 2.35 "${packages[@]}"
      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows' && inputs.release_tag != '' && inputs.sign_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installers = @(
            Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle' -Recurse -File |
              Where-Object { $_.Extension -in @('.exe', '.msi') }
          )
          if ($installers.Count -lt 2) {
            throw "Expected signed MSI and EXE installers, found $($installers.Count)"
          }

          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature on $($installer.Name): $($signature.Status)"
            }
            Write-Host "Valid Authenticode signature: $($installer.Name)"
          }
      # Instrumentation: round 3 showed the bundler PRINTING built installer
      # paths while the upload step found the directory empty — list what
      # actually exists on disk between the two so the discrepancy is visible.
      - if: always()
        shell: bash
        run: ls -laR src-tauri/target/release/bundle 2>/dev/null || echo "bundle dir missing at upload time"
      # Upload every produced bundle form — first runs showed the exact
      # artifact names vary (AppImage vs AppImage.tar.gz etc.), so grab the
      # whole bundle tree and fail loudly if the build produced nothing.
      # if: always() — a partial bundle (deb + rpm good, AppImage failed) is
      # still worth capturing; the empty-dir error covers the nothing case.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: o8-port-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 7

  publish-preview:
    name: Publish selected previews
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: o8-port-*
          path: downloaded-artifacts
      - name: Validate tag and collect public preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_TARGET: ${{ inputs.publish_target }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must look like v0.1.662" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" != "$version" ]]; then
            echo "package version $package_version does not match $RELEASE_TAG" >&2
            exit 1
          fi

          is_draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.draft')"
          if [[ "$is_draft" != "false" ]]; then
            echo "$RELEASE_TAG is not an existing public release" >&2
            exit 1
          fi

          mkdir release-assets
          copy_one() {
            local pattern="$1"
            local destination="$2"
            local matches=()
            while IFS= read -r -d '' path; do
              matches+=("$path")
            done < <(find downloaded-artifacts -type f -name "$pattern" -print0)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "expected exactly one $pattern, found ${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "release-assets/$destination"
          }

          case "$PUBLISH_TARGET" in
            both)
              copy_one "o8_${version}_x64_en-US.msi" "o8_${version}_windows_x64_preview.msi"
              copy_one "o8_${version}_x64-setup.exe" "o8_${version}_windows_x64_preview.exe"
              copy_one "o8_${version}_amd64.AppImage" "o8_${version}_linux_amd64_preview.AppImage"
              copy_one "o8_${version}_amd64.deb" "o8_${version}_linux_amd64_preview.deb"
              copy_one "o8-${version}-1.x86_64.rpm" "o8_${version}_linux_x86_64_preview.rpm"
              checksum_file="SHA256SUMS-windows-linux-preview.txt"
              ;;
            linux)
              copy_one "o8_${version}_amd64.AppImage" "o8_${version}_linux_amd64_preview.AppImage"
              copy_one "o8_${version}_amd64.deb" "o8_${version}_linux_amd64_preview.deb"
              copy_one "o8-${version}-1.x86_64.rpm" "o8_${version}_linux_x86_64_preview.rpm"
              checksum_file="SHA256SUMS-linux-preview.txt"
              ;;
            windows)
              copy_one "o8_${version}_x64_en-US.msi" "o8_${version}_windows_x64_preview.msi"
              copy_one "o8_${version}_x64-setup.exe" "o8_${version}_windows_x64_preview.exe"
              checksum_file="SHA256SUMS-windows-preview.txt"
              ;;
            *)
              echo "publish_target must be both, linux, or windows" >&2
              exit 1
              ;;
          esac

          (
            cd release-assets
            sha256sum o8_* > "$checksum_file"
          )
      - name: Attest public preview assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: '${{ github.workspace }}/release-assets/*'
      - name: Upload public preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        shell: bash
        run: |
          set -euo pipefail

          upload_args=()
          if [[ "$REPLACE_EXISTING_ASSETS" == "true" ]]; then
            upload_args+=(--clobber)
          fi
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" "${upload_args[@]}"


  # The updater endpoint (o8.app's UpdateCard) reads latest.json from the
  # public updater mirror (hurttlocker/o8-releases), which today carries only
  # macOS assets — github.token cannot write to a repo other than this one,
  # so mirroring needs its own cross-repo credential. This job copies the
  # already-published Linux AppImage (and its minisign .sig, when one has
  # already been uploaded next to it) to the mirror release for the same tag.
  #
  # Copying is not advertising: only latest.json advertises a platform to the
  # updater, and that file is written exclusively by the operator's local
  # `npm run ship:linux-sig` step (never in CI — the signing key never leaves
  # the ship machine). That step in turn requires the AppImage to already
  # exist on the mirror before it will sign and publish. This job is what
  # gets it there, unsigned if need be, so the two steps aren't stuck waiting
  # on each other. It never touches latest.json itself.
  #
  # See docs/operations/linux-updater-mirror-publish.md.
  publish-mirror:
    name: Mirror Linux updater assets
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.publish_to_mirror
    needs: publish-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MIRROR_REPO: hurttlocker/o8-releases
    steps:
      - name: Validate inputs and required secret
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASES_MIRROR_TOKEN: ${{ secrets.RELEASES_MIRROR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must look like v0.1.662" >&2
            exit 1
          fi

          if [[ -z "$RELEASES_MIRROR_TOKEN" ]]; then
            echo "RELEASES_MIRROR_TOKEN secret is not configured on this repo — add a fine-grained PAT with contents:write on $MIRROR_REPO (see docs/operations/linux-updater-mirror-publish.md)" >&2
            exit 1
          fi
      - name: Download Linux updater assets from the source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          appimage_name="o8_${version}_linux_amd64_preview.AppImage"
          sig_name="${appimage_name}.sig"

          mkdir -p mirror-assets

          if ! gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$appimage_name" --dir mirror-assets; then
            echo "no $appimage_name asset on $GITHUB_REPOSITORY release $RELEASE_TAG — run this workflow with release_tag set and publish_target including linux first" >&2
            exit 1
          fi

          has_sig=false
          if gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "$sig_name" --dir mirror-assets; then
            has_sig=true
            echo "found $sig_name on the source release — mirroring it alongside the AppImage"
          else
            echo "no $sig_name on the source release yet — mirroring the AppImage unsigned. This is expected before the operator's local signing step (npm run ship:linux-sig) runs; that step requires the AppImage on the mirror first and will upload the .sig itself once it does."
          fi

          {
            echo "APPIMAGE_NAME=$appimage_name"
            echo "SIG_NAME=$sig_name"
            echo "HAS_SIG=$has_sig"
          } >> "$GITHUB_ENV"
      - name: Publish assets to the updater mirror release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_MIRROR_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" --repo "$MIRROR_REPO" >/dev/null 2>&1; then
            echo "$MIRROR_REPO has no release for $RELEASE_TAG — the mirror release itself is created by the operator's local ship step (scripts/release.mjs), not this workflow" >&2
            exit 1
          fi

          upload_args=("mirror-assets/$APPIMAGE_NAME")
          if [[ "$HAS_SIG" == "true" ]]; then
            upload_args+=("mirror-assets/$SIG_NAME")
          fi

          clobber_args=()
          if [[ "$REPLACE_EXISTING_ASSETS" == "true" ]]; then
            clobber_args+=(--clobber)
          fi

          gh release upload "$RELEASE_TAG" "${upload_args[@]}" \
            --repo "$MIRROR_REPO" "${clobber_args[@]}"

          if [[ "$HAS_SIG" == "true" ]]; then
            echo "mirrored $APPIMAGE_NAME + $SIG_NAME to $MIRROR_REPO release $RELEASE_TAG"
          else
            echo "mirrored $APPIMAGE_NAME (unsigned) to $MIRROR_REPO release $RELEASE_TAG — latest.json still does not advertise linux-x86_64 until npm run ship:linux-sig signs and publishes it"
          fi
