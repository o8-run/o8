name: o8 next Windows compile

# Measures how far o8 next (GPUI) is from compiling on Windows. The vendored
# GPUI carries its Windows backend; o8 next's own unix-only calls are the
# expected gap. Not a required check until it is green.

on:
  pull_request:
    branches: [main]
    paths: ['native/o8-next/**', '.github/workflows/next-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Windows x64 cargo check
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Check the app binary
        run: cargo check --locked --manifest-path native/o8-next/Cargo.toml --bin o8-next --message-format short
      - name: Build the release binary
        run: cargo build --release --locked --manifest-path native/o8-next/Cargo.toml --bin o8-next
      - name: Release binary size
        shell: pwsh
        run: Get-Item native/o8-next/target/release/o8-next.exe | Select-Object Name, Length
      - name: Start the release binary with --help
        continue-on-error: true
        shell: pwsh
        run: |
          $out = & native/o8-next/target/release/o8-next.exe --help 2>&1
          "exit code: $LASTEXITCODE"
          $out | Select-Object -First 40
      - name: Name the import the loader cannot resolve
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Resolve-Path native/o8-next/target/release/o8-next.exe).Path
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          "== dependents"
          & $dumpbin.FullName /nologo /dependents $exe
          $dbg = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64"
          "== debuggers present: $(Test-Path "$dbg\cdb.exe")"
          & "$dbg\gflags.exe" /i o8-next.exe +sls | Out-Null
          $snaps = & "$dbg\cdb.exe" -g -G -c "q" $exe --help 2>&1
          $snaps | Select-String -Pattern 'ERROR|could not be located|STATUS_|0xc0000139' | Select-Object -First 30
          [System.Environment]::OSVersion.VersionString
      - name: Compile the native tests
        run: cargo test --release --locked --manifest-path native/o8-next/Cargo.toml --no-run
      - name: Run the native CLI tests
        continue-on-error: true
        run: cargo test --release --locked --manifest-path native/o8-next/Cargo.toml --no-fail-fast --test shell_cli --test pane_grid_cli --test terminal_cli --test diff_cli
