name: Current app launch measurements

on:
  push:
    branches: [perf/current-app-launch]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm install -g npm@11.21.1
      - run: npm ci --prefer-offline
      - run: npm run typecheck:fast
      - run: npm run typecheck
      - run: npm test
      - run: npx vitest run tests/preship-gate.test.ts --maxWorkers=1

  measure:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[measure-launch]')
    runs-on: macos-latest
    timeout-minutes: 180
    concurrency:
      group: current-app-launch-measure
      cancel-in-progress: true
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      O8_RELEASE_BUILD_CACHE: 'off'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 0
      - name: Pin main at the branch point
        id: base
        run: |
          launch_base_sha=$(git -C harness merge-base origin/main HEAD)
          echo "sha=$launch_base_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: main/package-lock.json
      - name: Install build tools
        run: |
          npm install -g npm@11.21.1
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: npm ci --prefer-offline
        working-directory: main
      - name: Prepare the isolated release configuration
        run: |
          node harness/scripts/bench/native-launch-config.mjs main
          ln -s "$GITHUB_WORKSPACE/main/node_modules" harness/node_modules
      - name: Build main from the clean checkout
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: main
          args: --features dev-mcp-plugin --bundles app --config work/native-launch.json
      - name: Measure main three times before the fix
        continue-on-error: true
        run: >-
          node harness/scripts/bench/native-launch.mjs
          --app=main/src-tauri/target/release/bundle/macos/o8.app
          --sha=${{ steps.base.outputs.sha }} --samples=3 --check
          --output=${{ runner.temp }}/o8-launch-before
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-app-launch-before
          path: ${{ runner.temp }}/o8-launch-before/receipt.json
          retention-days: 1
      - name: Require real composer measurements
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/o8-launch-before/receipt.json', 'utf8'));
          if (report.samples.length !== 3 || report.samples.some(sample => !sample.acknowledged)) process.exit(1);
          JS
      - name: Wait for a measured-path fix on this branch
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          LAUNCH_BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          for launch_attempt in $(seq 1 180); do
            launch_candidate_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
            git -C harness fetch origin "$launch_candidate_sha"
            if ! git -C harness diff --quiet "$LAUNCH_BASE_SHA" "$launch_candidate_sha" -- src src-tauri scripts ':(exclude)scripts/bench/**' ':(exclude)scripts/preship-webview-gate.mjs'; then
              echo "sha=$launch_candidate_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo 'No measured-path candidate arrived within 45 minutes' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: head
      - run: npm ci --prefer-offline
        working-directory: head
      - run: node head/scripts/bench/native-launch-config.mjs head
      - name: Build head from the clean checkout
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: head
          args: --features dev-mcp-plugin --bundles app --config work/native-launch.json
      - name: Measure main and head back to back on this runner
        run: |
          node head/scripts/bench/native-launch.mjs --app=main/src-tauri/target/release/bundle/macos/o8.app --sha=${{ steps.base.outputs.sha }} --samples=3 --output="$RUNNER_TEMP/o8-launch-paired-main"
          node head/scripts/bench/native-launch.mjs --app=head/src-tauri/target/release/bundle/macos/o8.app --sha=${{ steps.candidate.outputs.sha }} --samples=3 --check --output="$RUNNER_TEMP/o8-launch-paired-head"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-app-launch-paired
          path: |
            ${{ runner.temp }}/o8-launch-paired-main/receipt.json
            ${{ runner.temp }}/o8-launch-paired-head/receipt.json
          retention-days: 1
