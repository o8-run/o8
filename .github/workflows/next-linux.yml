name: o8 next Linux shell

on:
  pull_request:
    branches: [main]
    paths: ['native/o8-next/**', 'scripts/next/**', '.github/actions/next-linux-setup/**', '.github/workflows/next-linux.yml', 'tests/o8-next-o8d-boot-real-path.test.ts', 'src/lib/ws-server/native-http-registry.ts', 'package.json', 'package-lock.json']
  push:
    branches: [main]
    paths: ['native/o8-next/**', 'scripts/next/**', '.github/actions/next-linux-setup/**', '.github/workflows/next-linux.yml', 'tests/o8-next-o8d-boot-real-path.test.ts', 'src/lib/ws-server/native-http-registry.ts', 'package.json', 'package-lock.json']

permissions:
  contents: read

concurrency:
  group: next-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Linux x64 release, first frame and idle RSS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/next-linux-setup
      - name: Build native release
        run: cargo build --release --locked --manifest-path native/o8-next/Cargo.toml
      - name: Warm-up and three fresh fixture hosts, native frames and budgets
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          xvfb-run -a -s '-screen 0 1440x1024x24 -nolisten tcp -noreset -br' node scripts/next/linux-headless.mjs --output work/next-linux
      # Receipt (b) for the Next-stopped switch (#5576): the same release binary boots against
      # the real WS process with the native transport on and Next stopped. Every route the window
      # reads must be answered natively, so a boot route missing from the native registry fails.
      - name: Boot against the WS process with Next stopped
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          xvfb-run -a -s '-screen 0 1440x1024x24 -nolisten tcp -noreset -br' env -u DBUS_SESSION_BUS_ADDRESS \
            O8_NEXT_BINARY="$PWD/native/o8-next/target/release/o8-next" npx vitest run tests/o8-next-o8d-boot-real-path.test.ts
      # Compile all test-only code, then run every native CLI integration suite.
      # The full GPUI fixture/throughput suite has recorded runs over 25 minutes;
      # it is excluded from this launch gate. A cold release and test build can
      # exceed nine minutes. Test after measurement
      # so test-support features cannot replace the release binary being measured.
      - name: Compile all native tests
        run: cargo test --release --locked --manifest-path native/o8-next/Cargo.toml --no-run
      - name: Run native CLI assertions
        run: cargo test --release --locked --manifest-path native/o8-next/Cargo.toml --test shell_cli --test pane_grid_cli --test terminal_cli --test diff_cli
      # The helper requires WebKit's bubblewrap sandbox and never renders
      # without it. Ubuntu 24.04 restricts unprivileged user namespaces and
      # does not enable an AppArmor exception for bwrap by default. Enable the
      # distribution's optional bwrap-userns-restrict profile, which later
      # Ubuntu releases enable by default. Lift the restriction on this runner
      # only if the profile cannot be loaded. A green run therefore does not
      # show that a default Ubuntu 24.04 install can render. The app is unchanged.
      - name: Allow the WebKit sandbox to create user namespaces
        run: |
          cargo build --release --locked --manifest-path native/o8-next/Cargo.toml --bin o8-next-viz-render
          test -x native/o8-next/target/release/o8-next-viz-render
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          probe() { bwrap --unshare-user --ro-bind / / true; }
          if probe; then
            echo "sandbox: bwrap can already create a user namespace"
            exit 0
          fi
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if sudo apt-get install -y --no-install-recommends apparmor-profiles \
            && test -f "$profile" \
            && sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict \
            && sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict \
            && probe; then
            echo "sandbox: loaded the distribution bwrap-userns-restrict AppArmor profile"
          else
            echo "sandbox: the bwrap profile did not load; lifting the AppArmor restriction on this runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            probe
          fi
      - name: Render Linux visualization cards through the helper process
        env:
          O8_NEXT_NATIVE_BINARY: ${{ github.workspace }}/native/o8-next/target/release/o8-next-viz-render
        # Exercise the private-bus fallback, independent of the runner's desktop bus.
        run: |
          xvfb-run -a -s '-screen 0 1440x1024x24 -nolisten tcp -noreset -br' env -u DBUS_SESSION_BUS_ADDRESS cargo test --release --locked --manifest-path native/o8-next/Cargo.toml --bin o8-next visualizations:: -- --nocapture --test-threads=1
      - name: Save fixture screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o8-next-linux-x64
          path: work/next-linux/
          if-no-files-found: error
          retention-days: 7
