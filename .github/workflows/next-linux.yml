name: o8 next Linux shell

on:
  pull_request:
    branches: [main]
    paths: ['native/o8-next/**', 'scripts/next/**']
  push:
    branches: [main]
    paths: ['native/o8-next/**', 'scripts/next/**']

permissions:
  contents: read

concurrency:
  group: next-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Linux x64 release, first frame and idle RSS
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      CARGO_TERM_COLOR: never
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --prefer-offline
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: native/o8-next
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install X11, fonts and software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libvulkan-dev mesa-vulkan-drivers xvfb xauth x11-xserver-utils imagemagick fonts-dejavu-core
      - name: Build native release
        run: cargo build --release --locked --manifest-path native/o8-next/Cargo.toml
      - name: Three fresh fixture hosts, native frames and budgets
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          xvfb-run -a -s '-screen 0 1440x1024x24 -nolisten tcp -noreset -br' node scripts/next/linux-headless.mjs --output work/next-linux
      - name: Save fixture screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o8-next-linux-x64
          path: work/next-linux/
          if-no-files-found: error
          retention-days: 7
