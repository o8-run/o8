name: CI

# Runs on every pull request, merge group and push to main. The repo is public,
# so Linux and Windows runners are free; the main-branch run keeps the README
# badge and the default-branch status honest after each merge (Q ruling
# 2026-09-11, reversing the PR-only rule from the private-repo days).
# A weekly run keeps integration coverage and dependency audits current;
# workflow_dispatch remains the on-demand path for a full remote check.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
    branches: [main]
  schedule:
    - cron: '17 5 * * 0'
    # Monday check: opens the weekly-lane issue when no Sunday run passed in
    # the last 8 days, which catches a cron GitHub dropped (#2391).
    - cron: '41 13 * * 1'
  workflow_dispatch:
    inputs:
      integration_base:
        description: 'Base ref for the changed-files integration lane. Empty runs the whole weekly suite.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ inputs.integration_base }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --prefer-offline
      - uses: actions/cache/restore@v4
        id: typecheck-cache
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ runner.os }}-node22-typecheck-v1-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-node22-typecheck-v1-${{ hashFiles('package-lock.json', 'tsconfig.json') }}-
      - run: npm run protocol:check
      - name: Measure fast typecheck with its own heap budget
        run: /usr/bin/time -f 'typecheck:fast wall=%e s peak_rss=%M KiB' npm run typecheck:fast
      - run: npm run typecheck
      # These bounded publication fixtures never contact release services or
      # build an app. Keep the stable/preview boundary on every PR.
      - name: Release channel policy
        run: npx vitest run tests/release-channel-real-path.test.ts
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.typecheck-cache.outputs.cache-hit != 'true'
        with:
          path: tsconfig.tsbuildinfo
          key: ${{ steps.typecheck-cache.outputs.cache-primary-key }}

  server-bundle-size:
    name: Server Bundle Size
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --prefer-offline
      - name: Build exported server bundles and enforce committed budgets
        run: node scripts/check-server-bundle-size.mjs
      - name: Reject the large-dependency fixture
        run: npx vitest run tests/server-bundle-size-real-path.test.ts

  typecheck-parity:
    name: Weekly Type Checker Parity
    if: github.event.schedule == '17 5 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci --prefer-offline
      - run: npm run typecheck -- --typegen-only
      - run: npm run typecheck:parity
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  # Lint restored to the PR lane 2026-07-18 (#1547): the error debt is burned
  # to zero on main (the old 398 baseline was mostly a stale nested worktree
  # being linted). Warnings don't fail the job; errors do.
  lint:
    name: Lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --prefer-offline
      - uses: actions/cache/restore@v4
        id: lint-cache
        with:
          path: .cache/eslint
          key: ${{ runner.os }}-node22-eslint-v1-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-node22-eslint-v1-${{ hashFiles('package-lock.json', 'eslint.config.mjs') }}-
      - run: npm run lint -- --cache --cache-strategy content --cache-location .cache/eslint
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main' && steps.lint-cache.outputs.cache-hit != 'true'
        with:
          path: .cache/eslint
          key: ${{ steps.lint-cache.outputs.cache-primary-key }}

  test-shards:
    name: Hermetic Unit Tests (shard ${{ matrix.shard }}/4)
    if: github.event.schedule != '41 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --prefer-offline
      - if: matrix.shard == 1
        run: npm run test:classification:check
      - if: matrix.shard == 1
        run: node scripts/ci/check-hermetic-shards.mjs
      - run: npm run test:unit -- --shard=${{ matrix.shard }}/4
        env:
          O8_TEST_TIMING_REPORT_PATH: test-results/hermetic-timings-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermetic-timings-${{ matrix.shard }}
          path: test-results/hermetic-timings-${{ matrix.shard }}.json

  # Keep branch protection and the merge queue on one stable required name.
  # always() prevents a failed/cancelled matrix from skipping this check.
  test:
    name: Hermetic Unit Tests
    needs: [test-shards, o8-next-tests]
    if: always() && github.event.schedule != '41 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require unit and native tests
        env:
          SHARD_RESULT: ${{ needs.test-shards.result }}
          NATIVE_RESULT: ${{ needs.o8-next-tests.result }}
        run: |
          echo "Hermetic shard result: $SHARD_RESULT"
          echo "Native test result: $NATIVE_RESULT"
          test "$SHARD_RESULT" = success && test "$NATIVE_RESULT" = success

  # PR lane (#2391): runs exactly the resource-owning test files the branch
  # touches, diffed from the merge-base with the base branch. No touched files
  # means the test steps skip and the check passes. No continue-on-error: a red
  # file fails the check unless it is in the exempted baseline described below. workflow_dispatch with integration_base runs the same
  # lane against that base. Merge groups diff their queued head from the queue's
  # base SHA so selection covers every pull request in the group.
  # Measured 2026-09-17, run 35178958985 (dispatch, integration_base=HEAD~40):
  # 18 touched files in 171.5s of gate time, 3m40s for the whole job including
  # npm ci. Whole-suite files average 6.2s each, so the 20-minute limit covers
  # a PR touching roughly 150 resource-owning files.
  integration-changed:
    name: Integration Tests (changed files)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && inputs.integration_base != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Select touched resource-owning tests
        id: select
        env:
          BASE_REF: ${{ github.event.merge_group.base_sha || (github.event_name == 'pull_request' && format('origin/{0}', github.base_ref)) || inputs.integration_base }}
          HEAD_REF: ${{ github.event.merge_group.head_sha || github.sha }}
        run: node scripts/ci/resource-owning-changed.mjs "$BASE_REF" "$HEAD_REF"
      - if: steps.select.outputs.count != '0'
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - if: steps.select.outputs.count != '0'
        run: npm ci --prefer-offline
      - name: Install resource-test prerequisites
        if: steps.select.outputs.count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep openssh-server
          rg --version
      - if: steps.select.outputs.count != '0'
        run: npm run test:integration -- ${{ steps.select.outputs.files }}
        env:
          O8_INTEGRATION_BASELINE: tests/integration-linux-baseline.json

  # Weekly whole-suite lane, split into six contiguous slices of the manifest
  # file list (O8_INTEGRATION_SHARD=k/6).
  # Measured 2026-10-16, run 38979346411 (dispatch, 695 files, two shards):
  # shard 1 took 348 files in 2008s of gate time; shard 2 reached file 179 of
  # 347 in 2073s when the 40-minute limit cancelled it. About 95 minutes of
  # test time unsharded, so six slices keep the slowest near 25 minutes.
  # Exempted baseline: files red on Linux in run 35178955102, listed in
  # tests/integration-linux-baseline.json. Every shard sets
  # O8_INTEGRATION_BASELINE, so those files still run and report "baseline red"
  # without failing the job. The list may only shrink; any other red file fails
  # the job.
  # A failed, timed-out, or cancelled Sunday run opens or updates the
  # "Weekly integration lane did not pass" issue; the Monday cron does the same
  # when no Sunday run passed, and closes the issue once one has.
  integration-weekly:
    name: Weekly Integration Tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    needs: test
    if: github.event.schedule == '17 5 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.integration_base == '')
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --prefer-offline
      - name: Install resource-test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep openssh-server
          rg --version
      - if: matrix.shard == 1
        run: npm run test:classification:check
      - run: npm run test:integration
        env:
          O8_INTEGRATION_SHARD: ${{ matrix.shard }}/6
          O8_INTEGRATION_BASELINE: tests/integration-linux-baseline.json

  integration-weekly-report:
    name: Weekly Integration Report
    needs: [integration-weekly]
    if: always() && github.event.schedule == '17 5 * * 0' && needs.integration-weekly.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          scripts/ci/weekly-integration-issue.sh open
          "Weekly shards: ${{ needs.integration-weekly.result }}."

  integration-weekly-watch:
    name: Weekly Integration Watch
    if: github.event.schedule == '41 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(date -u -d '8 days ago' +%Y-%m-%d)"
          passed=''
          for run in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event schedule \
              --created ">=$since" --limit 20 --json databaseId --jq '.[].databaseId'); do
            [ "$run" = "$GITHUB_RUN_ID" ] && continue
            ok="$(gh run view "$run" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '[.jobs[] | select(.name | startswith("Weekly Integration Tests")) | .conclusion] | length == 6 and all(. == "success")')"
            if [ "$ok" = true ]; then passed="$run"; break; fi
          done
          if [ -n "$passed" ]; then
            scripts/ci/weekly-integration-issue.sh close "Weekly run $passed passed all six shards."
          else
            scripts/ci/weekly-integration-issue.sh open "No scheduled run since $since passed all six weekly shards. The Sunday cron was dropped, failed, or timed out."
          fi

  # Launch posture: surface high-severity dependency findings without making
  # the first OSS PRs unmergeable. Remove continue-on-error once the remaining
  # semver-major advisories have been adjudicated.
  security:
    name: Security Audit
    if: github.event.schedule != '41 13 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      # The dependency-review API is Advanced-Security-gated on private repos
      # (live 403, first CI run 2026-07-30). Self-arms at the public flip.
      - name: Review dependency changes
        if: (github.event_name == 'pull_request' || github.event_name == 'merge_group') && !github.event.repository.private
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - name: Audit root dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # RUSTSEC-2026-0195: quick-xml >=0.41 is blocked by xcb 1.7.0, tauri-winrt-notification 0.7.2, and Tauri's plist 1.8.0.
          # RUSTSEC-2026-0194: quick-xml >=0.41 is blocked by xcb 1.7.0, tauri-winrt-notification 0.7.2, and Tauri's plist 1.8.0.
          # RUSTSEC-2026-0104: rustls-webpki 0.102.8 is pinned by sentry 0.34.0 through rustls 0.22.4.
          # RUSTSEC-2026-0098: rustls-webpki 0.102.8 is pinned by sentry 0.34.0 through rustls 0.22.4.
          # RUSTSEC-2026-0099: rustls-webpki 0.102.8 is pinned by sentry 0.34.0 through rustls 0.22.4.
          # RUSTSEC-2026-0049: rustls-webpki 0.102.8 is pinned by sentry 0.34.0 through rustls 0.22.4.
          # RUSTSEC-2026-0235: rkyv >=0.8.17 is blocked by rust_decimal 1.40.0 (rkyv 0.7 line) via byte-unit 5.2.0; o8 never deserializes rkyv archives.
          ignore: RUSTSEC-2026-0195,RUSTSEC-2026-0194,RUSTSEC-2026-0104,RUSTSEC-2026-0098,RUSTSEC-2026-0099,RUSTSEC-2026-0049,RUSTSEC-2026-0235

  governance-smoke:
    name: Governance Smoke
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # timeout is load-bearing: this job hung at the 6h GitHub ceiling 3x on
    # 2026-07-11 (open handle keeps node alive after the smoke passes) —
    # ~360 billed min per hang. The step-level `timeout` fails fast; the
    # job-level cap is the backstop.
    timeout-minutes: 10
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --prefer-offline
      - name: Merge-requires-review governance gate
        run: timeout --signal=KILL 300 env CORTEX_IDE_DATA_DIR=$(mktemp -d) NODE_OPTIONS=--conditions=react-server npx tsx scripts/smoke-merge-requires-review.ts

  # Build removed from the PR lane 2026-07-11 (Q ruling: "runs through money
  # too quick for no reason") — at ~9 billed min/run x ~100 PR runs/week it was
  # the most expensive green job, re-verifying what the real signed build does
  # at ship time anyway. Run on-demand via workflow_dispatch when a remote
  # build check is genuinely wanted.
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lock is generated by npm 11 on the dev machines; Node 22 bundles
      # npm 10, whose `npm ci` validator rejects npm-11 lock graphs with
      # phantom "Missing: <pkg> from lock file" errors (live-hit 2026-07-05,
      # broke every PR + main). One npm version everywhere.
      - run: npm install -g "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci --prefer-offline
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ── Non-Darwin compile gates (#1673 Windows, #1672 Linux) ──────────────────
  # The port work is mapped (docs/internals/port-audit-windows.md) but until
  # these jobs existed nothing ever compiled the Rust shell on a non-Darwin
  # target — every enumerated blocker was invisible to CI, and a contributor
  # without a Mac had no way to verify anything. `cargo check` of the Tauri
  # crate catches the compile-time class (un-cfg'd macOS-only code,
  # target-gated deps, path-dep resolution) without needing a frontend build.
  #
  # Both targets compile clean as of run 31047139210 (2026-08-05), so the
  # gates are BLOCKING — a PR that breaks non-Darwin compilation goes red.
  # Both targets also run on merge groups so their required checks cover the
  # queued commit, alongside pull requests, main pushes and manual runs.
  rust-check-windows:
    name: Rust Compile Gate (Windows)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Select native inputs
        id: native
        run: node scripts/ci/native-changes.mjs
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.native.outputs.changed == 'true'
        with:
          toolchain: stable
      # PR caches are scoped to their own ref and evict main's (#4335).
      # Save on main only; every PR restores the main cache.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.native.outputs.changed == 'true'
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tauri's codegen validates frontendDist AND bundle resources at compile
      # time; CI never runs the Next build, so stub both directories it points
      # at (../out/frontend, ../out/server). The dev-mcp-plugin dep needs no
      # stub anymore — the plugin is vendored in-repo (tauri-plugin-mcp/).
      - run: New-Item -ItemType Directory -Force -Path out/frontend, out/server | Out-Null
        if: steps.native.outputs.changed == 'true'
        shell: pwsh
      - run: cargo check --locked
        if: steps.native.outputs.changed == 'true'
        working-directory: src-tauri
      - name: Native update ping contract
        if: steps.native.outputs.changed == 'true'
        run: node scripts/test-update-ping-native.mjs
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target

  rust-check-linux:
    name: Rust Compile Gate (Linux)
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Select native inputs
        id: native
        run: node scripts/ci/native-changes.mjs
      # Tauri v2 system deps for linux builds (webkit2gtk 4.1 line). No ALSA
      # headers needed — the audio crates are target-gated to macOS.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev build-essential
        if: steps.native.outputs.changed == 'true'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.native.outputs.changed == 'true'
        with:
          toolchain: stable
      # PR caches are scoped to their own ref and evict main's (#4335).
      # Save on main only; every PR restores the main cache.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        if: steps.native.outputs.changed == 'true'
        with:
          workspaces: src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: mkdir -p out/frontend out/server
        if: steps.native.outputs.changed == 'true'
      - run: cargo check --locked
        if: steps.native.outputs.changed == 'true'
        working-directory: src-tauri
      - name: Native update ping contract
        if: steps.native.outputs.changed == 'true'
        run: node scripts/test-update-ping-native.mjs
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      - name: Experimental o8d delivery bus
        if: steps.native.outputs.changed == 'true'
        run: cargo test --locked --manifest-path crates/o8d/Cargo.toml --all-features

  o8-next-tests:
    name: o8 next Native Tests (Linux)
    if: github.event.schedule != '41 13 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_HOME: ${{ github.workspace }}/.o8-next-cargo
      CARGO_TARGET_DIR: ${{ github.workspace }}/native/o8-next/target
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      O8D_HTTP_TEST_BINARY: ${{ github.workspace }}/native/o8-next/target/debug/o8d
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Select native next inputs
        id: native
        run: node scripts/ci/native-changes.mjs --o8-next
      - uses: ./.github/actions/next-linux-setup
        if: steps.native.outputs.changed == 'true'
        with:
          cache-key: tests-${{ hashFiles('crates/o8d/Cargo.lock') }}
      - name: Build the persisted-history fixture daemon
        if: steps.native.outputs.changed == 'true'
        run: cargo build --locked --manifest-path crates/o8d/Cargo.toml --features experimental-http --bin o8d
      - name: Headless native tests
        if: steps.native.outputs.changed == 'true'
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          TIMEFORMAT='o8 next native tests wall=%3R s'
          time cargo test --locked --manifest-path native/o8-next/Cargo.toml -- --test-threads=4

  roadmap-check:
    name: Roadmap Drift Check
    if: github.event_name == 'push' || github.event.schedule == '17 5 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails when a tracking-issue checklist claims a child shipped that is
      # still open, or when ROADMAP.md's Now section links a closed issue.
      # Closed-but-unreleased children are listed as awaiting release, not
      # failed. Read-only; touches no files.
      - name: Check ROADMAP.md against the tracking issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/roadmap-status.mjs --check
