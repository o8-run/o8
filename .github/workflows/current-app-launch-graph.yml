name: Inspect current app launch scripts
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        description: Run containing the preserved clean main app
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ARTIFACT_RUN: ${{ github.event.inputs.artifact_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: current-app-launch-main-app
          run-id: ${{ env.ARTIFACT_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}
      - name: Inspect the preserved artifact
        run: |
          mkdir -p "$RUNNER_TEMP/launch-app"
          tar -C "$RUNNER_TEMP/launch-app" -xf "$RUNNER_TEMP/main-app.tar"
          node scripts/bench/launch-script-graph.mjs "$RUNNER_TEMP/launch-app/o8.app/Contents/Resources/server/.next"
