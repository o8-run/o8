name: Current app idle memory measurements

on:
  push:
    branches: [fix/4581-idle-memory-budget]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180
    concurrency:
      group: current-app-idle-memory-measure
      cancel-in-progress: true
    outputs:
      base: ${{ steps.source.outputs.base }}
      head: ${{ steps.source.outputs.head }}
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      O8_RELEASE_BUILD_CACHE: 'off'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          fetch-depth: 0
      - name: Pin both source commits
        id: source
        run: |
          echo "base=$(git -C harness merge-base origin/main HEAD)" >> "$GITHUB_OUTPUT"
          echo "head=$(git -C harness rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.base }}
          path: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: main/package-lock.json
      - name: Install build tools
        run: |
          npm install -g npm@11.21.1
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: npm ci --prefer-offline
        working-directory: main
      - run: node harness/scripts/bench/native-memory-config.mjs main
      - name: Build main from the clean checkout
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: main
          args: --features dev-mcp-plugin --bundles app --config work/native-memory.json
      - name: Preserve main's exact artifact
        run: tar -C main/src-tauri/target/release/bundle/macos -cf "$RUNNER_TEMP/main-app.tar" o8.app
      - uses: actions/upload-artifact@v4
        with:
          name: current-app-memory-main-app
          path: ${{ runner.temp }}/main-app.tar
          compression-level: 0
          retention-days: 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.head }}
          path: head
      - run: npm ci --prefer-offline
        working-directory: head
      - run: node head/scripts/bench/native-memory-config.mjs head
      - name: Build head from the clean checkout
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: head
          args: --features dev-mcp-plugin --bundles app --config work/native-memory.json
      - name: Preserve head's exact artifact
        run: tar -C head/src-tauri/target/release/bundle/macos -cf "$RUNNER_TEMP/head-app.tar" o8.app
      - uses: actions/upload-artifact@v4
        with:
          name: current-app-memory-head-app
          path: ${{ runner.temp }}/head-app.tar
          compression-level: 0
          retention-days: 1

  measure:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 90
    concurrency:
      group: current-app-idle-memory-comparison
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm install -g npm@11.21.1
      - run: npm ci --prefer-offline
        working-directory: harness
      - uses: actions/download-artifact@v4
        with:
          name: current-app-memory-main-app
          path: ${{ runner.temp }}/main-artifact
      - uses: actions/download-artifact@v4
        with:
          name: current-app-memory-head-app
          path: ${{ runner.temp }}/head-artifact
      - name: Restore the exact built artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/main-artifact" "$GITHUB_WORKSPACE/head-artifact"
          tar -C "$GITHUB_WORKSPACE/main-artifact" -xf "$RUNNER_TEMP/main-artifact/main-app.tar"
          tar -C "$GITHUB_WORKSPACE/head-artifact" -xf "$RUNNER_TEMP/head-artifact/head-app.tar"
      - name: Measure main before head on this runner
        continue-on-error: true
        run: node harness/scripts/bench/native-memory.mjs --app=main-artifact/o8.app --sha=${{ needs.build.outputs.base }} --check --output="$RUNNER_TEMP/o8-memory-main"
      - name: Require the completed baseline workload
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/o8-memory-main/receipt.json', 'utf8'));
          if (!report.teardownVerified || !report.samples[0]?.workload?.persistedOutputUnchanged || !report.samples[0]?.rss?.afterIdle) process.exit(1);
          JS
      - name: Measure head immediately after main
        run: node harness/scripts/bench/native-memory.mjs --app=head-artifact/o8.app --sha=${{ needs.build.outputs.head }} --check --output="$RUNNER_TEMP/o8-memory-head"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-app-idle-memory-paired
          path: |
            ${{ runner.temp }}/o8-memory-main/receipt.json
            ${{ runner.temp }}/o8-memory-head/receipt.json
          retention-days: 1
