name: PR Review Bot

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: PR Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const stats = {
              totalFiles: files.length,
              additions: files.reduce((sum, f) => sum + f.additions, 0),
              deletions: files.reduce((sum, f) => sum + f.deletions, 0),
              largeFiles: files.filter(f => f.changes > 300),
              newFiles: files.filter(f => f.status === 'added'),
            };

            // Scan for TODOs/FIXMEs in changed files
            const { execSync } = require('child_process');
            let todos = [];
            try {
              const diff = execSync('git diff origin/main...HEAD', { encoding: 'utf-8', maxBuffer: 10 * 1024 * 1024 });
              const todoMatches = diff.match(/^\+.*(?:TODO|FIXME|HACK|XXX).*$/gm) || [];
              todos = todoMatches.map(t => t.replace(/^\+\s*/, '').trim()).slice(0, 10);
            } catch { }

            // Build comment
            let body = `## 🔍 PR Review Bot\n\n`;
            body += `| Metric | Value |\n|---|---|\n`;
            body += `| Files changed | ${stats.totalFiles} |\n`;
            body += `| Additions | +${stats.additions} |\n`;
            body += `| Deletions | -${stats.deletions} |\n`;
            body += `| New files | ${stats.newFiles.length} |\n\n`;

            if (stats.largeFiles.length > 0) {
              body += `### ⚠️ Large files (>300 lines changed)\n`;
              for (const f of stats.largeFiles) {
                body += `- \`${f.filename}\` — +${f.additions}/-${f.deletions}\n`;
              }
              body += `\n`;
            }

            if (todos.length > 0) {
              body += `### 📝 TODOs found in diff\n`;
              for (const t of todos) {
                body += `- \`${t.substring(0, 120)}\`\n`;
              }
              body += `\n`;
            }

            if (stats.totalFiles > 20) {
              body += `> **Note:** This PR touches ${stats.totalFiles} files. Consider splitting into smaller PRs.\n\n`;
            }

            body += `---\n*Automated review — [CI workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions)*`;

            const { postPrReviewComment } = await import(`${process.cwd()}/scripts/ci/pr-review-comment.mjs`);
            await postPrReviewComment({ github, context, core, body });
