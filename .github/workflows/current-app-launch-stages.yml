name: Current app launch stage profile

on:
  workflow_dispatch:
  push:
    branches: [perf/current-app-launch-stages]

permissions:
  contents: read
  actions: read

env:
  MAIN_SOURCE: 103f4a09922e9ec5015b6bc52cb3000e273d923e
  MEASUREMENT_HARNESS: 01ab614f9de8a3b597edb23137df1991859e9871

jobs:
  saved-profile:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MEASUREMENT_HARNESS }}
          path: harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm install -g npm@11.21.1
      - run: npm ci --prefer-offline
        working-directory: harness
      - name: Verify the observer through a real server
        run: node --test lab/scripts/bench/launch-stage-profile.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: current-app-launch-head-app
          run-id: 40395085469
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/saved
      - name: Restore the saved startup artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/saved-app"
          tar -C "$GITHUB_WORKSPACE/saved-app" -xf "$RUNNER_TEMP/saved/head-app.tar"
      - name: Profile the remaining startup path
        continue-on-error: true
        run: node lab/scripts/bench/native-launch-stages.mjs --harness=harness --app=saved-app/o8.app --sha=b47688c6becfc1adc9f9480daa455f5fce7812f2 --samples=1 --profile --check-background-dashboard --output="$RUNNER_TEMP/o8-launch-stage-saved"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-app-launch-stage-saved
          path: ${{ runner.temp }}/o8-launch-stage-saved/*.json
          retention-days: 1

  build-main:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      O8_RELEASE_BUILD_CACHE: 'off'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_SOURCE }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install build tools
        run: |
          npm install -g npm@11.21.1
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: npm ci --prefer-offline
        working-directory: app
      - name: Apply identical measurement-only startup and frame probes
        run: node lab/scripts/bench/prepare-launch-stage-build.mjs app
      - name: Build clean main with the local startup prefetch patch
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: app
          args: --features dev-mcp-plugin --bundles app --config work/native-launch.json
      - name: Preserve the exact main app
        run: tar -C app/src-tauri/target/release/bundle/macos -cf "$RUNNER_TEMP/main-app.tar" o8.app
      - uses: actions/upload-artifact@v4
        with:
          name: current-app-launch-stage-main-app
          path: ${{ runner.temp }}/main-app.tar
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: current-app-launch-stage-main-modules
          path: app/work/launch-client-modules.json
          retention-days: 1
