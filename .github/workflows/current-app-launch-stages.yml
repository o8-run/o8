name: Current app launch stage profile

on:
  workflow_dispatch:
    inputs:
      main_run_id:
        description: Run containing the clean main app with identical measurement probes
        default: ''
        required: false

permissions:
  contents: read
  actions: read

env:
  MAIN_SOURCE: 103f4a09922e9ec5015b6bc52cb3000e273d923e
  MEASUREMENT_HARNESS: 01ab614f9de8a3b597edb23137df1991859e9871

jobs:
  build-main:
    if: inputs.main_run_id == ''
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      O8_RELEASE_BUILD_CACHE: 'off'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MAIN_SOURCE }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install build tools
        run: |
          npm install -g npm@11.21.1
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: npm ci --prefer-offline
        working-directory: app
      - name: Apply identical measurement-only startup and frame probes
        run: node lab/scripts/bench/prepare-launch-stage-build.mjs app
      - name: Build clean main with the local startup prefetch patch
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: app
          args: --features dev-mcp-plugin --bundles app --config work/native-launch.json
      - name: Preserve the exact main app
        run: tar -C app/src-tauri/target/release/bundle/macos -cf "$RUNNER_TEMP/main-app.tar" o8.app
      - uses: actions/upload-artifact@v4
        with:
          name: current-app-launch-stage-main-app
          path: ${{ runner.temp }}/main-app.tar
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: current-app-launch-stage-main-modules
          path: app/work/launch-client-modules.json
          retention-days: 1

  build-head:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      O8_RELEASE_BUILD_CACHE: 'off'
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install build tools
        run: |
          npm install -g npm@11.21.1
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: npm ci --prefer-offline
        working-directory: app
      - name: Apply identical measurement-only startup and frame probes
        run: node lab/scripts/bench/prepare-launch-stage-build.mjs app
      - name: Build clean head with the local startup prefetch patch
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: app
          args: --features dev-mcp-plugin --bundles app --config work/native-launch.json
      - name: Preserve the exact head app
        run: tar -C app/src-tauri/target/release/bundle/macos -cf "$RUNNER_TEMP/head-app.tar" o8.app
      - uses: actions/upload-artifact@v4
        with:
          name: current-app-launch-stage-head-app
          path: ${{ runner.temp }}/head-app.tar
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: current-app-launch-stage-head-modules
          path: app/work/launch-client-modules.json
          retention-days: 1

  compare:
    needs: [build-main, build-head]
    if: always() && needs.build-head.result == 'success' && (needs.build-main.result == 'success' || needs.build-main.result == 'skipped')
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: lab
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.MEASUREMENT_HARNESS }}
          path: harness
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: harness/package-lock.json
      - run: npm install -g npm@11.21.1
      - run: npm ci --prefer-offline
        working-directory: harness
      - name: Verify the observer through a real server
        run: node --test lab/scripts/bench/launch-stage-profile.test.mjs
      - uses: actions/download-artifact@v4
        with:
          name: current-app-launch-stage-main-app
          run-id: ${{ inputs.main_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/main
      - uses: actions/download-artifact@v4
        with:
          name: current-app-launch-stage-main-modules
          run-id: ${{ inputs.main_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/main
      - uses: actions/download-artifact@v4
        with:
          name: current-app-launch-stage-head-app
          path: ${{ runner.temp }}/head
      - uses: actions/download-artifact@v4
        with:
          name: current-app-launch-stage-head-modules
          path: ${{ runner.temp }}/head
      - name: Restore the two clean app artifacts
        run: |
          mkdir -p main-app head-app
          tar -C main-app -xf "$RUNNER_TEMP/main/main-app.tar"
          tar -C head-app -xf "$RUNNER_TEMP/head/head-app.tar"
      - name: Main three runs, then head three runs on this seat
        run: |
          node lab/scripts/bench/native-launch-stages.mjs --harness=harness --app=main-app/o8.app --sha="$MAIN_SOURCE" --samples=3 --output="$RUNNER_TEMP/launch-main"
          node lab/scripts/bench/native-launch-stages.mjs --harness=harness --app=head-app/o8.app --sha="$GITHUB_SHA" --samples=3 --check-cli-startup --output="$RUNNER_TEMP/launch-head"
      - name: Main startup discovery budget (red)
        continue-on-error: true
        run: node lab/scripts/bench/check-launch-stage-receipt.mjs "$RUNNER_TEMP/launch-main/stages.json" --check-cli-startup
      - name: Head startup discovery budget (green)
        run: node lab/scripts/bench/check-launch-stage-receipt.mjs "$RUNNER_TEMP/launch-head/stages.json" --check-cli-startup
      - name: Keep the one-second launch target visible
        continue-on-error: true
        run: node lab/scripts/bench/check-launch-stage-receipt.mjs "$RUNNER_TEMP/launch-head/stages.json" --check
      - name: Profile main separately from timing
        run: node lab/scripts/bench/native-launch-stages.mjs --harness=harness --app=main-app/o8.app --sha="$MAIN_SOURCE" --samples=1 --profile --stats="$RUNNER_TEMP/main/launch-client-modules.json" --output="$RUNNER_TEMP/profile-main"
      - name: Profile head separately from timing
        run: node lab/scripts/bench/native-launch-stages.mjs --harness=harness --app=head-app/o8.app --sha="$GITHUB_SHA" --samples=1 --profile --stats="$RUNNER_TEMP/head/launch-client-modules.json" --check-cli-startup --output="$RUNNER_TEMP/profile-head"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-app-launch-stage-comparison
          path: |
            ${{ runner.temp }}/launch-main/*.json
            ${{ runner.temp }}/launch-head/*.json
            ${{ runner.temp }}/profile-main/*.json
            ${{ runner.temp }}/profile-head/*.json
          retention-days: 7
