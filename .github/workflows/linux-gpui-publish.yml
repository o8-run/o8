name: Linux GPUI release attachment

on:
  workflow_dispatch:
    inputs:
      publish_linux:
        description: 'Operator approval to attach the signed GPUI AppImage (never DEB/RPM)'
        type: boolean
        default: false
      release_tag:
        description: 'Existing public release tag'
        type: string
        required: true
      build_run_id:
        description: 'Successful Linux GPUI download artifacts run built at that exact tag'
        type: string
        required: true
      updater_signature:
        description: 'Public updater signature for the exact downloaded AppImage bytes'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: linux-gpui-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  attach:
    if: inputs.publish_linux == true
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Validate tag input
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Read-only inspection prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends squashfs-tools binutils
      - name: Validate release and exact GPUI build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh release view "$RELEASE_TAG" --json isDraft --jq 'if .isDraft then error("Draft release") else . end'
          expected=$(git rev-parse HEAD)
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > run.json
          EXPECTED_SHA="$expected" node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const run = JSON.parse(readFileSync("run.json"));
            if (run.path !== ".github/workflows/linux-downloads.yml" || run.conclusion !== "success"
              || run.head_sha !== process.env.EXPECTED_SHA || run.event !== "workflow_dispatch") {
              throw new Error("Expected successful manual GPUI build at release tag");
            }
          '
          gh run download "$BUILD_RUN_ID" --name linux-gpui-review-packages --dir packages
      - name: Authenticate AppImage identity and matching channel manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          O8_PUBLISH_LINUX: ${{ inputs.publish_linux }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPDATER_SIGNATURE: ${{ inputs.updater_signature }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          image="packages/o8-$version-x86_64.AppImage"
          test -f "$image"
          test "$(find packages -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          node scripts/prepare-linux-release-attachment.mjs
          chmod +x "$image"
          node scripts/ci/check-linux-glibc.mjs --max 2.35 "$image"
      - name: Attach new assets without replacement or updater feed changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/upload-linux-release-assets.mjs
