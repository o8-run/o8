name: Linux package cache proof

on:
  pull_request:
    paths:
      - .github/actions/linux-package-prerequisites/**
      - .github/workflows/linux-package-cache-proof.yml
      - scripts/ci/linux-package-prerequisites.*
  push:
    branches: [main]
    paths:
      - .github/actions/linux-package-prerequisites/**
      - .github/workflows/linux-package-cache-proof.yml
      - scripts/ci/linux-package-prerequisites.*

permissions:
  contents: read

# PRs cannot seed the main-only shared cache. Transfer the same archives as a
# short-lived proof artifact to a fresh runner instead. Both timed steps use
# the production installer and verify its download/cache receipt.
jobs:
  miss:
    name: Linux package cache miss
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      source: ${{ steps.install.outputs.source }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Linux Rust prerequisites (miss)
        id: install
        env:
          O8_PACKAGE_CACHE: ${{ runner.temp }}/linux-package-cache-proof
        run: node scripts/ci/linux-package-prerequisites.mjs install --group=rust --cache="$O8_PACKAGE_CACHE"
      - name: Require a measured cache miss
        env:
          SOURCE: ${{ steps.install.outputs.source }}
          ELAPSED_MS: ${{ steps.install.outputs.elapsedMs }}
        run: |
          test "$SOURCE" = download || test "$SOURCE" = installed
          echo "Cache miss: $ELAPSED_MS ms" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.install.outputs.source == 'download'
        with:
          name: linux-package-cache-proof
          path: |
            ${{ runner.temp }}/linux-package-cache-proof/*.deb
            ${{ runner.temp }}/linux-package-cache-proof/manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1
          compression-level: 0
  hit:
    name: Linux package cache hit
    needs: miss
    if: needs.miss.outputs.source == 'download'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux-package-cache-proof
          path: ${{ runner.temp }}/linux-package-cache-proof
      - name: Install Linux Rust prerequisites (hit, downloads disabled)
        id: install
        env:
          O8_PACKAGE_CACHE: ${{ runner.temp }}/linux-package-cache-proof
        run: node scripts/ci/linux-package-prerequisites.mjs install --group=rust --cache="$O8_PACKAGE_CACHE"
      - name: Require a measured offline cache hit
        env:
          SOURCE: ${{ steps.install.outputs.source }}
          ELAPSED_MS: ${{ steps.install.outputs.elapsedMs }}
        run: |
          test "$SOURCE" = cache
          echo "Cache hit: $ELAPSED_MS ms" >> "$GITHUB_STEP_SUMMARY"
