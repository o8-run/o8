name: Linux GPUI download artifacts

on:
  pull_request:
    branches: [main, linux/claimed-startup]
    paths: ['scripts/linux/**', 'scripts/ci/check-linux-glibc.mjs', 'cli/**', 'src/lib/next/**', '.github/workflows/linux-downloads.yml', '.github/actions/next-linux-setup/**', 'package.json', 'package-lock.json']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-downloads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Ubuntu 22.04 x64, unpublished GPUI packages
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/next-linux-setup
        with:
          cache-key: downloads-ubuntu22-glibc235
      - name: Package tools and pinned build inputs
        run: |
          df -h /
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm cpio squashfs-tools mesa-vulkan-drivers patchelf
          mkdir -p work
          node scripts/linux/fetch-build-inputs.mjs "$RUNNER_TEMP/linux-dl-cache" > work/linux-inputs.json
          echo "O8_APPIMAGETOOL=$(node -p 'require("./work/linux-inputs.json").appimagetool')" >> "$GITHUB_ENV"
          echo "O8_APPIMAGE_RUNTIME=$(node -p 'require("./work/linux-inputs.json").runtime')" >> "$GITHUB_ENV"
      - name: Real package entry-point regressions
        env:
          O8_LINUX_PACKAGE_TESTS: 'true'
        run: nice -n 10 npx vitest run tests/linux-download-packages-real-path.test.ts
      - name: Build GPUI and export the bundled server
        run: |
          df -h /
          nice -n 10 cargo build --release --locked --manifest-path native/o8-next/Cargo.toml
          nice -n 10 npm run tauri:prebuild
      - name: Stage, package and scan every shipped ELF
        run: |
          NODE_ROOT=$(node -p 'require("./work/linux-inputs.json").nodeRoot')
          nice -n 10 node scripts/linux/stage-payload.mjs --server out/server --node-root "$NODE_ROOT" --next-binary native/o8-next/target/release/o8-next --output work/linux-stage
          nice -n 10 node scripts/linux/package-payload.mjs --stage work/linux-stage --output work/linux-downloads --appimagetool "$O8_APPIMAGETOOL" --runtime "$O8_APPIMAGE_RUNTIME"
          nice -n 10 node scripts/ci/check-linux-glibc.mjs --max 2.35 work/linux-downloads/*.AppImage work/linux-downloads/*.deb work/linux-downloads/*.rpm
      - name: Save unpublished packages and their size and hash manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-gpui-review-packages
          path: work/linux-downloads/
          if-no-files-found: error
          retention-days: 7

  acceptance:
    name: Fresh ${{ matrix.runner }} ${{ matrix.format }} and connected windows
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            runner: ubuntu-24.04
          - format: appimage
            runner: ubuntu-22.04
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-gpui-review-packages
          path: work/linux-downloads
      # This runner never installs Node or builds o8. Package installation must
      # provide its own runtime and dependencies; these tools capture evidence.
      - name: Graphical proof prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-xserver-utils imagemagick mesa-vulkan-drivers vulkan-tools x11-utils fonts-dejavu-core libwebkit2gtk-4.1-0 libgtk-3-0 dbus-daemon
          chmod +x work/linux-downloads/*.AppImage
      - name: Install DEB, fresh-server and terminal-daemon launch, then uninstall
        if: matrix.format == 'deb'
        run: |
          sudo apt-get install -y ./work/linux-downloads/*.deb
          test -x /usr/lib/o8/o8-next-viz-render
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_ICD_FILENAMES"
          xvfb-run -a -s '-screen 0 1440x1024x24 -nolisten tcp -noreset -br' /usr/lib/o8/node scripts/linux/diagnose-payload.mjs / work/deb-diagnostics
          xvfb-run -a -s '-screen 0 1440x1024x24 -nolisten tcp -noreset -br' /usr/lib/o8/node scripts/linux/smoke-payload.mjs --installed-root / --output work/deb-proof
          cp /usr/lib/o8/node "$RUNNER_TEMP/o8-proof-node"
          sudo apt-get remove -y o8
          test ! -e /usr/bin/o8
          test ! -e /usr/lib/o8/o8-next-viz-render
          "$RUNNER_TEMP/o8-proof-node" --input-type=module -e '
            import {existsSync, readFileSync, rmSync, writeFileSync} from "node:fs";
            const path = "work/deb-proof/receipt.json";
            const receipt = JSON.parse(readFileSync(path));
            const root = receipt.retainedProfileRoot;
            if (!root.startsWith("/tmp/o8-linux-installed-")) throw new Error("Unexpected proof profile root");
            for (const name of ["fresh-server", "terminal-daemon"]) {
              if (!existsSync(root + "/" + name + "/next-shell.json")) throw new Error("Uninstall lost user data");
            }
            receipt.installationRemovedDataPreserved = true;
            delete receipt.retainedProfileRoot;
            writeFileSync(path, JSON.stringify(receipt, null, 2));
            rmSync(root, {recursive:true});
          '
          rm "$RUNNER_TEMP/o8-proof-node"
      - name: AppImage linker, renderer and stock offline diagnosis
        if: matrix.format == 'appimage'
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          work/linux-downloads/*.AppImage --appimage-extract
          test -x squashfs-root/usr/lib/o8/o8-next-viz-render
          xvfb-run -a -s '-screen 0 1440x1024x24 -nolisten tcp -noreset -br' squashfs-root/usr/lib/o8/node scripts/linux/diagnose-payload.mjs squashfs-root work/appimage-diagnostics
          docker build -f scripts/linux/diagnostic-stock.Dockerfile -t o8-appimage-stock-diagnosis .
          mkdir -p work/stock-diagnostics
          image=$(find work/linux-downloads -name '*.AppImage' -print -quit)
          docker run --rm --init --network none \
            -v "$PWD/scripts/linux:/work/scripts/linux:ro" \
            -v "$PWD/squashfs-root:/payload:ro" \
            -v "$PWD/work/linux-downloads:/packages:ro" \
            -v "$PWD/work/stock-diagnostics:/proof" \
            o8-appimage-stock-diagnosis \
            xvfb-run -a -s '-screen 0 1440x1024x24 -nolisten tcp -noreset -br' \
            /payload/usr/lib/o8/node /work/scripts/linux/diagnose-payload.mjs /payload /proof "/packages/$(basename "$image")"
          docker image rm o8-appimage-stock-diagnosis
      - name: AppImage fresh-server and terminal-daemon launch
        if: matrix.format == 'appimage'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          unset VK_ICD_FILENAMES VK_DRIVER_FILES
          xvfb-run -a -s '-screen 0 1440x1024x24 -nolisten tcp -noreset -br' squashfs-root/usr/lib/o8/node scripts/linux/smoke-payload.mjs --appimage "$(find work/linux-downloads -name '*.AppImage' -print -quit)" --output work/appimage-proof
          if grep -R -F 'Using bundled software Vulkan driver' work/appimage-proof; then exit 1; fi
      - name: AppImage offline fresh-server and terminal-daemon launch
        if: matrix.format == 'appimage'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          unset VK_ICD_FILENAMES VK_DRIVER_FILES
          # A private network namespace has no external interfaces. Enable only
          # loopback, which the bundled server and native window use locally.
          sudo unshare --net bash -euc '
            ip link set lo up
            ip -o link show
            test "$(ip -o link show | cut -d: -f2 | tr -d " ")" = lo
            ip -brief address
            test -z "$(ip route show)"
            if timeout 5 bash -c "exec 3<>/dev/tcp/1.1.1.1/443"; then
              echo "Offline proof refused: public connection succeeded" >&2
              exit 1
            fi
            echo "[offline-proof] only loopback; public connection failed as required"
            exec runuser -u "$SUDO_USER" -- env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES \
              LIBGL_ALWAYS_SOFTWARE=1 APPIMAGE_EXTRACT_AND_RUN=1 \
              xvfb-run -a -s "-screen 0 1440x1024x24 -nolisten tcp -noreset -br" \
              squashfs-root/usr/lib/o8/node scripts/linux/smoke-payload.mjs \
              --appimage "$(find work/linux-downloads -name "*.AppImage" -print -quit)" \
              --output work/appimage-offline-proof
          '
          if grep -R -F 'Using bundled software Vulkan driver' work/appimage-offline-proof; then exit 1; fi
      - name: Save first frames, launch evidence and idle RSS
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-gpui-${{ matrix.format }}-install-proof
          path: |
            work/deb-proof/
            work/deb-diagnostics/
            work/appimage-proof/
            work/appimage-diagnostics/
            work/stock-diagnostics/
            work/appimage-offline-proof/
            work/appimage-no-driver-proof/
          if-no-files-found: error
          retention-days: 7

  bundled-driver:
    name: ${{ matrix.label }} AppImage without system Vulkan drivers
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Ubuntu 22.04
          - os: ubuntu-24.04
            label: Ubuntu 24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-gpui-review-packages
          path: work/linux-downloads
      - name: Capture prerequisites without a system Vulkan ICD
        run: |
          sudo apt-get update -qq
          sudo apt-get purge -y mesa-vulkan-drivers
          sudo apt-get install -y --no-install-recommends xvfb xauth x11-xserver-utils imagemagick x11-utils fonts-dejavu-core libwebkit2gtk-4.1-0 libgtk-3-0 dbus-daemon
          sudo apt-get purge -y libvulkan1
          test ! -e /usr/lib/x86_64-linux-gnu/libvulkan.so.1
          test "$(dpkg-query -W -f='${Status}' mesa-vulkan-drivers 2>/dev/null || true)" != 'install ok installed'
          test -z "$(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -name '*.json' 2>/dev/null)"
          chmod +x work/linux-downloads/*.AppImage
          work/linux-downloads/*.AppImage --appimage-extract
      - name: Bundled driver first frame with only loopback networking
        run: |
          sudo unshare --net bash -euc '
            ip link set lo up
            test "$(ip -o link show | cut -d: -f2 | tr -d " ")" = lo
            test -z "$(ip route show)"
            if timeout 5 bash -c "exec 3<>/dev/tcp/1.1.1.1/443"; then exit 1; fi
            exec runuser -u "$SUDO_USER" -- env -u VK_ICD_FILENAMES -u VK_DRIVER_FILES \
              APPIMAGE_EXTRACT_AND_RUN=1 \
              xvfb-run -a -s "-screen 0 1440x1024x24 -nolisten tcp -noreset -br" \
              squashfs-root/usr/lib/o8/node scripts/linux/smoke-payload.mjs \
              --appimage "$(find work/linux-downloads -name "*.AppImage" -print -quit)" \
              --output work/bundled-driver-proof
          '
          grep -R -F 'Using bundled software Vulkan driver' work/bundled-driver-proof
      - name: Disabled bundled driver preserves actionable nonzero failure
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          O8_DISABLE_BUNDLED_VULKAN: '1'
        run: |
          proof=$(mktemp -d)
          export O8_DATA_DIR="$proof/data" XDG_DATA_HOME="$proof/xdg"
          unset VK_ICD_FILENAMES VK_DRIVER_FILES
          image=$(find work/linux-downloads -name '*.AppImage' -print -quit)
          "$image" serve > "$proof/daemon-before.json"
          before=$(squashfs-root/usr/lib/o8/node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).pid' "$proof/daemon-before.json")
          set +e
          timeout --kill-after=5 90 xvfb-run -a "$image" > "$proof/startup.log" 2>&1
          result=$?
          set -e
          cat "$proof/startup.log"
          test "$result" -ne 0
          test "$result" -ne 124
          test "$result" -ne 137
          grep -F 'NoSupportedDeviceFound' "$proof/startup.log"
          grep -F 'Check that a usable Vulkan graphics device and driver are available' "$proof/startup.log"
          if grep -F 'Using bundled software Vulkan driver' "$proof/startup.log"; then exit 1; fi
          "$image" serve status > "$proof/daemon-after.json"
          squashfs-root/usr/lib/o8/node -e 'const s=JSON.parse(require("fs").readFileSync(process.argv[1])); if (!s.healthy || s.pid !== Number(process.argv[2])) process.exit(1)' "$proof/daemon-after.json" "$before"
          "$image" serve stop
          mkdir -p work/disabled-driver-proof
          cp "$proof/startup.log" "$proof/daemon-before.json" "$proof/daemon-after.json" work/disabled-driver-proof/
          rm -rf "$proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: linux-bundled-driver-proof-${{ matrix.os }}
          path: |
            work/bundled-driver-proof/
            work/disabled-driver-proof/
          retention-days: 7
