name: PR size

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  # addLabels/removeLabel on a PR go through the issues endpoint but are
  # permission-checked against the PR resource — read 403s with "Resource not
  # accessible by integration" (live-hit PR #1642, first-ever run).
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Label by diff size
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const labels = [
              { name: 'size/XS', max: 9, color: 'EEEBE2' },
              { name: 'size/S', max: 49, color: 'CFCAC0' },
              { name: 'size/M', max: 249, color: 'A8A398' },
              { name: 'size/L', max: 999, color: '706C64' },
              { name: 'size/XL', max: Number.POSITIVE_INFINITY, color: '17140F' },
            ];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const changes = files.reduce((total, file) => total + file.changes, 0);
            const selected = labels.find((label) => changes <= label.max);

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: `Pull request with ${label.name.slice(5)} diff size`,
                });
              }
            }

            const current = context.payload.pull_request.labels.map((label) => label.name);
            for (const name of current.filter((name) => name.startsWith('size/') && name !== selected.name)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name,
              }).catch((error) => {
                if (error.status !== 404) throw error;
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [selected.name],
            });
