[package]
name = "o8"
version = "0.1.813"
description = "o8 — governance layer for autonomous engineering teams"
authors = ["hurttlocker"]
license = "MIT"
repository = "https://github.com/o8-run/o8"
edition = "2021"
rust-version = "1.77.2"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
# Keep crash line tables in separate dSYM artifacts, outside the app bundle.
debug = 1
split-debuginfo = "packed"

# Native context creation compiles capability URL patterns at runtime. Keep the
# regex engine optimized in debug builds too; application code stays debuggable.
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.urlpattern]
opt-level = 3

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
# Parse o8.release.json at build time to bake the Sentry DSN (release only).
serde_json = "1.0"

[features]
default = []
# Exposes the Tauri webview to AI agents (screenshot + click + eval) via an
# MCP server on a Unix socket — the plugin is vendored at ../tauri-plugin-mcp
# (repo root, see its VENDORED.md). Enable in dev with:
# `cargo tauri dev --features dev-mcp-plugin`. Signed/prod builds always
# enable it (tauri:build:signed passes --features dev-mcp-plugin).
dev-mcp-plugin = ["dep:tauri-plugin-mcp"]

[dependencies]
semver = "1"
o8-restart-safety = { path = "../crates/o8-restart-safety" }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon", "macos-private-api", "image-png"] }
# No "zip" feature: o8 publishes v2 updater artifacts (the macOS .app.tar.gz and
# the Windows setup .exe), so the updater never extracts a .zip, and dropping
# the feature removes the zip crate (RUSTSEC-2026-0367/0368/0369).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
# Phase 4 (background presence): launch-at-login. Default ON so the pill + Fn
# hotkey work without opening o8. Plugin manipulated only from Rust via the
# `background` module's commands — no JS-side autostart capability needed.
tauri-plugin-autostart = "2"
# Voice P3 hotkeys: OS-global keyboard shortcuts (⌘⇧Space summon, ⌘⌥V paste-last
# dictation, ⌘⇧, open-settings). The Fn / double-tap-Fn gestures stay on the raw
# CGEventTap in fn_hotkey.rs (modifier-only gestures the plugin can't bind).
tauri-plugin-global-shortcut = "2"
# (rodio + cpal moved to the macOS target table below — the voice stack is
# macOS-only, and on Linux they drag in alsa-sys which needs system headers.)
# Already in the lock graph transitively (Tauri's async runtime). Promoted to a
# direct dep so the TTS playback thread can build its own current-thread runtime
# for async reqwest synth before handing MP3 bytes to !Send rodio. Zero binary
# cost; features unify with Tauri's. `sync` adds the oneshot channel + Semaphore
# the Symon voice-agent loop uses for the confirm gate.
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync"] }
# Optional: see [features].dev-mcp-plugin above. Vendored in-repo so fresh
# clones resolve without any sibling checkout (#1673 — cargo reads optional
# path deps' manifests even when the feature is off).
tauri-plugin-mcp = { path = "../tauri-plugin-mcp", optional = true }
window-vibrancy = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }

# Crash/error reporting for the native shell (telemetry ruling). DORMANT unless a
# RELEASE build baked a DSN (build.rs → cargo:rustc-env=O8_SENTRY_DSN). Keep
# reqwest/rustls support and the debug images previously enabled by minidump.
# Shared reqwest features can also enable native TLS. This SDK/minidump pair
# removes the legacy bundled roots without changing certificate-verification options.
sentry = { version = "0.42", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls"] }

# Native crash capture — the class of crash the `panic` hook above CANNOT see:
# hardware faults + aborts (SIGSEGV / SIGABRT / SIGBUS / SIGILL / SIGFPE and
# stack-overflow). Version 0.13 depends on `sentry ^0.42` without enabling its
# default transport, so these two pins advance together. It keeps `crash-handler 0.6` +
# `minidumper 0.8` via `minidumper-child 0.2`.
#
# How it works (see telemetry::init_minidump_handler): `init()` re-execs THIS
# same signed binary with `--crash-reporter-server=<uuid>` to run an
# out-of-process reporter sibling. On a native crash the main process hands its
# OWN Mach task/thread ports to that sibling over Mach IPC; the sibling writes a
# minidump from those ports and uploads it AS A SENTRY ATTACHMENT at crash time
# (out-of-process ⇒ a stack-overflow crash is captured on a fresh stack).
#
# macOS notes: crash-handler installs a Mach exception port (EXC_BAD_ACCESS ⇒
# SEGV/BUS, EXC_BAD_INSTRUCTION ⇒ ILL, EXC_ARITHMETIC ⇒ FPE, EXC_BREAKPOINT ⇒
# TRAP) PLUS an explicit SIGABRT signal handler (abort has no Mach exception).
# Tonight's crash class — stack-overflow → EXC_BAD_ACCESS in Rust's stack-guard
# handler → abort/SIGABRT — is caught on BOTH the Mach and the SIGABRT paths.
# No `ipc` feature: the static scope tags (app_version/plan/founder/surface) are
# set by telemetry::init, which runs in the reporter process too, so the
# minidump event already carries them without cross-process scope sync.
#
# Signing/notarization: the reporter is a re-exec of the SAME Developer-ID,
# hardened-runtime binary — it inherits the identical code signature +
# entitlements, so there is NOTHING extra to sign or notarize. Memory is read
# via the explicitly-handed Mach port, NOT task_for_pid, so no debugger
# entitlement (com.apple.security.cs.debugger / get-task-allow) is required.
sentry-rust-minidump = "0.13"

# Issue #755: runtime-download for codebase-memory-mcp static binary.
# All three crates are already in the transitive lock graph (reqwest pulled
# in by tauri-plugin-updater, sha2/hex by other crates) — promoting them to
# direct deps adds zero binary cost.
#   - reqwest: blocking HTTPS GET against github.com (release redirect → S3)
#   - sha2:    SHA-256 verification against the pinned upstream checksum
#   - hex:     hex-encode the digest for comparison against the constant
# rustls (not native-tls) keeps us off OpenSSL link issues on signed builds.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json", "http2", "multipart"] }
sha2 = "0.10"
hex = "0.4"

# ── Voice STT engine (lifted from aqua/Symon, de-Symonized) ──
# The Swift sidecar (`helpers/speech_recognizer.swift`) does the audio capture
# + Apple Speech recognition; these Rust crates power the streaming bridge, the
# Gemini polish pass, and the optional Whisper re-transcription.
#
# The STT *streaming* path stays Swift-owned, but the system-wide Symon fold
# (paste-into-focused-app + the global Fn CGEventTap) DOES pull objc2/AppKit/
# CoreGraphics on macOS — see the `[target.'cfg(target_os = "macos")'.dependencies]`
# block below. `paste.rs` needs NSWorkspace/NSRunningApplication/NSPasteboard +
# the Accessibility AX walk, and `fn_hotkey.rs` needs a raw CGEventTap; both are
# genuinely native and cannot be expressed through the Swift helper.
#   - tracing:   logging macros used verbatim by the lifted modules.
#   - hound:     pure-Rust WAV parser for the PCM the Swift helper writes.
#   - flacenc:   pure-Rust WAV→FLAC transcode (~3x) before Gemini upload.
#   - base64:    inline_data audio encode for Gemini + OpenRouter Whisper.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hound = "3.5"
flacenc = "0.5"
base64 = "0.22"
#   - image:     pure-Rust PNG decode/encode + resize for Symon Spatial Context
#     (burn the operator's drawn strokes into the screenshot + cut a full-res
#     crop of the marked region). PNG feature only — no system codecs.
image = { version = "0.25", default-features = false, features = ["png"] }

# ── Symon voice agent (tool-calling loop, lifted from aqua, de-Symonized) ──
# The agent parses model-emitted ISO due-dates/event-times into macOS date
# components and stamps the local "current time" into its system prompt. chrono
# (default `clock` feature) is the smallest robust way to do both.
chrono = "0.4"
tauri-plugin-clerk = "0.1.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-dialog = "2"

# Shutdown safety net (issue #719). Both crates are already in the lock graph
# transitively; promoting them to direct deps is zero binary cost. Used to
# tear down spawned Node children on SIGTERM / SIGINT so they don't outlive
# the parent and orphan onto launchd while still holding ports 3001/3002.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
libc = "0.2"

# ── Windows CLI PATH registration (#1741, part of #1673) ──
# Both crates are already resolved in the lock graph transitively (winreg via
# tauri-plugin-autostart's auto-launch dep, windows-sys via winreg itself) —
# promoting them to direct deps costs nothing extra, same precedent as the
# reqwest/sha2/hex promotion above. winreg edits HKCU\Environment\Path (no
# elevation needed); windows-sys broadcasts WM_SETTINGCHANGE afterward so
# already-running shells (e.g. Explorer) pick up the change without a reboot.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# ── Windows/Linux `o8://` deep-link registration (#1742, part of #1673) ──
# macOS registers the scheme through the bundle (Info.plist CFBundleURLTypes)
# and reasserts it at runtime via LaunchServices (url_scheme_handler.rs); those
# paths stay untouched. Windows needs HKCU\Software\Classes\o8 registry keys and
# Linux needs an `x-scheme-handler/o8` .desktop association — both of which
# tauri-plugin-deep-link writes at runtime from `plugins.deep-link.desktop.schemes`
# (see tauri.windows.conf.json / tauri.linux.conf.json), and which the bundler
# also stamps into the NSIS/WiX/deb/rpm installers from the same config key.
#
# Deliberately gated to the two platforms that need it rather than
# `cfg(not(target_os = "macos"))`: single-instance compiles to an EMPTY crate on
# android/ios (its lib.rs carries `#![cfg(not(any(android, ios)))]`), so a
# not-macos gate would leave a latent compile break if o8 ever grows a Tauri
# mobile target. macOS resolves neither crate either way — the whole point.
#
# `single-instance` carries the `deep-link` feature so a second launch forwards
# its argv into the already-running instance's deep-link plugin instead of
# booting a second app (that IS how Windows/Linux deliver a URL to a live app).
# It must be registered BEFORE the deep-link plugin in the builder chain.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# ── Linux voice floor (#1672) ──
# System speech (piper / espeak-ng / spd-say) and `pactl` ducking, detected at
# runtime and shelled out to, so no ALSA/PipeWire headers or C++ toolchain
# enter the shell build. Whisper (whisper-rs) lives only in the crate's
# separate `o8-speech-recognizer` helper binary behind its `whisper` feature,
# which this dependency does not enable.
[target.'cfg(target_os = "linux")'.dependencies]
o8-linux-voice = { path = "../crates/o8-linux-voice" }
x11rb = { version = "=0.13.2", features = ["xinput"] }

# ── System-wide Symon fold: paste + global Fn hotkey (macOS only) ──
# Versions pinned to aqua/Symon's exact stack so the lifted `paste.rs` +
# `fn_hotkey.rs` compile verbatim and so this objc2 generation links cleanly
# alongside `window-vibrancy 0.6` (which uses the older objc/cocoa generation —
# the two coexist because they bind disjoint symbol sets).
#   - objc2 / objc2-foundation: NSString + objc runtime for the AppKit calls.
#   - objc2-app-kit: NSWorkspace (frontmost app), NSRunningApplication (activate),
#     NSPasteboard (clipboard snapshot/write). NSVisualEffectView/quartz-core are
#     NOT pulled — those are P3 dock-vibrancy only, out of scope for P0-P2.
#   - core-graphics: the CGEventTap (Fn capture) + synthetic Cmd+V CGEvent.
#   - core-foundation: CFDictionary/CFString/CFRunLoop for the AX + tap plumbing.
[target.'cfg(target_os = "macos")'.dependencies]
# ── Audio (voice stack is macOS-only, #1673) ──
# rodio: TTS playback for read-aloud / "say" / spoken Ask answers (ElevenLabs +
# Google direct → MP3 → rodio) + the sound.rs cue worker. Pinned to 0.19 to
# match aqua's stack — rodio 0.20+ changed the OutputStream/Sink/Decoder APIs
# the lifted playback code uses.
rodio = "0.19"
# cpal: stt/capture.rs input-device streaming for local Whisper capture.
cpal = "0.17.1"
security-framework = "3.7"
screencapturekit = { version = "=11.0.0", features = ["macos_15_0"] }
objc2 = "0.6"
# NSString/NSData/NSJSONSerialization power browser_view::eval_result — the host
# reads the WKWebView evaluateJavaScript return value back as JSON (see browser_view.rs).
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSJSONSerialization", "NSError"] }
# WKWebView.evaluateJavaScript_completionHandler for the same eval-with-return path.
objc2-web-kit = { version = "0.3", features = ["WKWebView", "block2"] }
core-graphics = "0.24"
core-foundation = "0.10"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSWindow", "NSScreen", "NSColor", "NSResponder", "NSView", "NSGraphics", "NSUserInterfaceItemIdentification"] }
# EventKit — Symon's calendar list. The JXA whose-clause scan took 27s on a
# real 14-calendar set (the 30s osascript cap made "what's on my calendar"
# effectively dead); the indexed EventKit store answers in milliseconds.
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKCalendarItem", "EKCalendar", "EKObject", "EKTypes", "block2"] }
block2 = "0.6"

# Keep native auth diagnostics independent of untrusted SDK payloads/errors.
[patch.crates-io]
# Pinned context-codegen patch: intern remote ACL patterns (#4380).
# Provenance and removal criteria: vendor/tauri-codegen-2.6.3/VENDORED.md.
tauri-codegen = { version = "=2.6.3", path = "vendor/tauri-codegen-2.6.3" }
tauri-plugin-clerk = { path = "vendor/tauri-plugin-clerk-0.1.1" }
clerk-fapi-rs = { path = "vendor/clerk-fapi-rs-0.2.0" }

[dev-dependencies]
tauri = { version = "2.10.3", features = ["test"] }
