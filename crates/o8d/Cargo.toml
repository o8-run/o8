[package]
name = "o8d"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
experimental-mcp = ["dep:libc", "dep:axum", "dep:reqwest", "dep:rusqlite", "dep:sha2", "dep:chrono", "dep:unicode-normalization", "dep:uuid"]
experimental-ws = ["dep:tokio-tungstenite", "dep:futures-util", "dep:form_urlencoded", "dep:subtle", "dep:uuid"]
experimental-supervisor = ["dep:libc", "dep:base64", "dep:subtle", "dep:uuid"]
experimental-http = ["dep:axum", "dep:form_urlencoded", "dep:subtle", "dep:rusqlite", "dep:chrono", "dep:sha2", "dep:base64"]

[dependencies]
axum = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
sha2 = { version = "0.10", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
unicode-normalization = { version = "0.1", optional = true }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "io-std", "io-util", "signal", "time", "process", "fs"] }
libc = { version = "0.2", optional = true }
base64 = { version = "0.22", optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
form_urlencoded = { version = "1", optional = true }
subtle = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[[bin]]
name = "o8d"
path = "src/main.rs"

[[bin]]
name = "o8d-mcp"
path = "src/mcp_main.rs"
required-features = ["experimental-mcp"]
