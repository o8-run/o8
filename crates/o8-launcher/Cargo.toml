[package]
name = "o8-launcher"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
o8-launch-core = { path = "../o8-launch-core" }
o8-restart-safety = { path = "../o8-restart-safety" }
libc = "0.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# The classic shell's updater (tauri-plugin-updater 2.10) verifies and unpacks
# with these same crates; the launcher reuses them instead of new cryptography.
minisign-verify = "=0.2.5"
tar = "0.4.46"
flate2 = "1.1.9"
semver = "1.0.27"
base64 = "0.23"

[dev-dependencies]
# Signs fixture archives with a key generated in the test; the same signer
# family as the release tooling. Never used with the release key.
minisign = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSArray", "NSDate", "NSRunLoop", "NSThread", "NSObjCRuntime", "NSNotification"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSEvent", "libc"] }
