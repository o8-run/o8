[package]
name = "o8-launcher"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
o8-launch-core = { path = "../o8-launch-core" }
o8-restart-safety = { path = "../o8-restart-safety" }
libc = "0.2"
signal-hook = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json"] }
